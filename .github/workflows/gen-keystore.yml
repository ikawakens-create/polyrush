name: Generate Debug Keystore (one-time, DO NOT MERGE)

on:
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate fixed debug keystore
        run: |
          keytool -genkeypair \
            -keystore polyrush-debug.jks \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Base64 encode keystore
        run: base64 -w 0 polyrush-debug.jks > keystore-base64.txt
      - name: Upload base64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: polyrush-keystore-base64
          path: keystore-base64.txt
